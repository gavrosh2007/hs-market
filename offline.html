<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет соединения — HS Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 1rem;
        }
        .container {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 32px;
            border: 1px solid #e8491d;
            max-width: 400px;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; color: #e8491d; }
        p { margin-bottom: 1.5rem; color: #ccc; }
        button {
            background: #e8491d;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #c04010; }
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Нет интернета</h1>
        <p>Проверьте подключение. Как только сеть появится — приложение заработает.</p>
        <button onclick="location.reload()">⟳ Попробовать снова</button>
    </div>
    <script>
        setInterval(() => {
            if (navigator.onLine) location.reload();
        }, 3000);
    </script>
</body>
</html>
